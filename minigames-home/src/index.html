<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>미니게임</title>
    <style>
      :root {
        --bg: #faf6ef;
        --surface: #fff;
        --text: #2a241c;
        --muted: #6f6557;
        --border: #e4dccf;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1b16;
          --surface: #2b261f;
          --text: #f5efe6;
          --muted: #b5aa9a;
          --border: #453d32;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Apple SD Gothic Neo',
          sans-serif;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 32px 16px;
      }
      h1 {
        margin: 0 0 24px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      .card {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
      }
      .card[aria-disabled='true'] {
        opacity: 0.6;
      }
      .emoji {
        font-size: 32px;
      }
      .name {
        font-weight: 700;
      }
      .desc {
        color: var(--muted);
        font-size: 14px;
      }
      .best {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 700;
        color: #b4560b;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- 임시 화면: 디자인 파일(playlab-home.html)이 나오면 교체한다. 게임 목록은 빌드 때 아래 ul 안에 채워진다. -->
      <h1>미니게임</h1>
      <ul>
        <!--GAMES-->
      </ul>
    </main>
    <script>
      // 이 기기에 저장된 내 최고기록을 카드에 보여준다(게임이 localStorage에 minigames:best:<slug>[:<보드>]로 저장).
      // 달고나처럼 보드(모양)가 여러 개면 그중 가장 높은 점수를 보여준다.
      try {
        for (const badge of document.querySelectorAll('[data-best-slug]')) {
          const prefix = 'minigames:best:' + badge.dataset.bestSlug;
          let best = 0;
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key === prefix || key.startsWith(prefix + ':')) {
              best = Math.max(best, Number(localStorage.getItem(key)) || 0);
            }
          }
          if (best > 0) badge.textContent = '내 최고 ' + best + '점';
        }
      } catch {
        // 저장소를 쓸 수 없으면(사생활 보호 모드 등) 기록 없이 보여준다
      }
    </script>
  </body>
</html>
