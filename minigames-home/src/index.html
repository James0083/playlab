<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>미니게임</title>
    <style>
      :root {
        --bg: #faf6ef;
        --surface: #fff;
        --text: #2a241c;
        --muted: #6f6557;
        --border: #e4dccf;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1b16;
          --surface: #2b261f;
          --text: #f5efe6;
          --muted: #b5aa9a;
          --border: #453d32;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Apple SD Gothic Neo',
          sans-serif;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 32px 16px;
      }
      h1 {
        margin: 0 0 24px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      .card {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
      }
      .card[aria-disabled='true'] {
        opacity: 0.6;
      }
      .emoji {
        font-size: 32px;
      }
      .name {
        font-weight: 700;
      }
      .desc {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- 임시 화면: 디자인 완료본(minigames-home.html)으로 교체한다. <!--GAMES-->
      위치에 목록이 들어간다. -->
      <h1>미니게임</h1>
      <ul>
        <!--GAMES-->
      </ul>
    </main>
  </body>
</html>
